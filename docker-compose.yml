services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      # Set to true to bypass auth temporarily (frontend-only)
      # - NEXT_PUBLIC_AUTH_DISABLED=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    working_dir: /app
    command: yarn dev --hostname 0.0.0.0 --port 3000

volumes:
  node_modules:
  next_cache: