services:
  app:
    # Dev: use the plain node image — no need to build the production Dockerfile.
    # Source is live-mounted via volumes; only the node binary is from the image.
    image: node:22-alpine
    working_dir: /app
    ports:
      - 3000:3000
    env_file:
      - .env.docker
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    networks:
      - erp-network
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "yarn install && yarn dev --hostname 0.0.0.0 --port 3000"

volumes:
  node_modules:
  next_cache:

networks:
  erp-network:
    external: true
    name: erp-network
