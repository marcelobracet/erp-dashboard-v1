services:
  app:
    image: node:22-alpine
    container_name: erp-dashboard
    working_dir: /app
    ports:
      - 3000:3000
    env_file:
      - .env.local
    networks:
      - erp-network
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "yarn install && yarn dev --hostname 0.0.0.0 --port 3000"

volumes:
  node_modules:
  next_cache:

networks:
  erp-network:
    external: true
    name: erp-network
