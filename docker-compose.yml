services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    working_dir: /app
    command: yarn dev --hostname 0.0.0.0 --port 3000

volumes:
  node_modules:
  next_cache:
